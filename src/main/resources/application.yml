server:
  port: ${PORT:8080}

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      # La URI de cada microservicio se puede cambiar con una variable de entorno
      # (en AWS sera la del balanceador interno de la VPC).
      routes:
        - id: ms-autenticacion
          uri: ${MS_AUTENTICACION_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: ms-ordenes
          uri: ${MS_ORDENES_URL:http://localhost:8082}
          predicates:
            - Path=/api/ordenes/**
        - id: ms-inventario
          uri: ${MS_INVENTARIO_URL:http://localhost:8083}
          predicates:
            - Path=/api/productos/**
        - id: ms-picking-despacho
          uri: ${MS_PICKING_URL:http://localhost:8084}
          predicates:
            - Path=/api/picking/**

# NOTA: la validacion de JWT (RBAC) que muestra el diagrama se implementa como un GlobalFilter que
# verifique la firma del token emitido por ms-autenticacion antes de reenviar la peticion; queda como
# siguiente paso (ver README de este modulo).

app:
  webhook:
    # Clave compartida con la AWS Lambda que reenvia los avisos de venta (autenticacion M2M, filtro ApiKey).
    # En AWS vendria de Secrets Manager; en local se define con la variable de entorno WEBHOOK_API_KEY.
    api-key: ${WEBHOOK_API_KEY:clave-local-solo-para-desarrollo}
